// Променената функция, която взима пресния линк от сървъра
async function loadStream(id) {
    const video = document.getElementById('video');
    try {
        // Викаме ендпоинта, за да вземем линковете
        const res = await fetch(`${API_BASE}/api/streams`);
        const links = await res.json();
        const m3u8Url = links[id];

        if (!m3u8Url) {
            console.warn(`Няма намерен активен линк за канал: ${id}`);
            // Ако линкът липсва, показваме съобщение над плейъра
            document.getElementById('currentChannelName').innerText = "Стриймът се обновява в момента... Опитайте след 10 сек.";
            return;
        }

        if (Hls.isSupported()) {
            if (currentHls) currentHls.destroy();
            currentHls = new Hls();
            currentHls.loadSource(m3u8Url);
            currentHls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = m3u8Url;
        }
    } catch (err) {
        console.error("Грешка при зареждане на видео поток:", err);
    }
}

// Смяна на Тема
function toggleTheme() {
    if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
    } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
    }
    updateThemeButtonText();
}

function updateThemeButtonText() {
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('theme-text').innerText = isDark ? 'Светъл режим' : 'Тъмен режим';
}

// ОСНОВНА ФУНКЦИЯ: Взимане на каналите динамично от Бекенда
// ОСНОВНА ФУНКЦИЯ: Взимане на каналите динамично от Бекенда и рендиране с лога
async function fetchAndRenderChannels() {
    const container = document.getElementById('categoriesContainer');
    container.innerHTML = `<div class="text-xs font-semibold text-slate-400 dark:text-zinc-500 p-2 animate-pulse">Зареждане на каналите...</div>`;
    
    try {
        const res = await fetch(`${API_BASE}/api/streams`);
        const streams = await res.json();
        
        // Премахваме служебния ключ от кеша на сървъра, за да останат само каналите
        const activeKeys = Object.keys(streams).filter(key => key !== 'lastUpdated');

        if (activeKeys.length === 0) {
            container.innerHTML = `<div class="text-xs font-semibold text-red-500 p-2">Няма активни стриймове на сървъра.</div>`;
            return;
        }

        // Групиране на получените канали по категории спрямо речника ни channelMeta
        const categories = {};
        activeKeys.forEach(key => {
            const meta = channelMeta[key] || { name: key.toUpperCase(), badge: 'TV', category: 'Други Канали', logo: '' };
            if (!categories[meta.category]) {
                categories[meta.category] = [];
            }
            categories[meta.category].push({ id: key, ...meta });
        });

        // Генериране на HTML структурата с лога на телевизиите
        let htmlOutput = '';
        for (const [catName, items] of Object.entries(categories)) {
            htmlOutput += `
                <div class="space-y-2.5">
                    <h3 class="text-[11px] font-bold tracking-widest text-slate-400 dark:text-zinc-500 uppercase px-1">
                        ${catName}
                    </h3>
                    <div class="space-y-1.5">
                        ${items.map(ch => `
                            <button id="ch-${ch.id}" onclick="switchChannel('${ch.id}', '${ch.name}')" 
                                class="w-full flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-zinc-800/40 text-left transition duration-200 group bg-slate-50/50 dark:bg-zinc-900/30">
                                <div class="h-9 w-9 bg-white dark:bg-zinc-850 p-1.5 rounded-lg flex items-center justify-center border border-slate-200/60 dark:border-zinc-700/40 group-hover:border-red-500 transition duration-200 overflow-hidden">
                                    ${ch.logo ? `
                                        <img src="${ch.logo}" 
                                             alt="${ch.badge}" 
                                             class="max-w-full max-h-full object-contain filter dark:brightness-110" 
                                             onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'font-extrabold text-[10px] text-slate-700 dark:text-zinc-300\'>${ch.badge}</span>';" />
                                    ` : `<span class="font-extrabold text-xs text-slate-700 dark:text-zinc-300">${ch.badge}</span>`}
                                </div>
                                <span class="text-sm font-semibold text-slate-800 dark:text-zinc-200 group-hover:text-red-500 transition duration-150">
                                    ${ch.name}
                                </span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = htmlOutput;

        // По подразбиране пускаме първия наличен канал от бекенда при първоначално зареждане
        if (activeKeys.length > 0) {
            const firstChannelId = activeKeys[0];
            const firstChannelName = channelMeta[firstChannelId]?.name || firstChannelId.toUpperCase();
            switchChannel(firstChannelId, firstChannelName);
        }

    } catch (err) {
        console.error("Грешка при комуникация със сървъра:", err);
        container.innerHTML = `<div class="text-xs font-semibold text-red-500 p-2">Сървърът е офлайн (${API_BASE})</div>`;
    }
}

// Превключване на Канал
function switchChannel(id, channelName) {
    selectedChannel = id;
    
    // Обновяване заглавието на програмата
    document.getElementById('currentChannelName').innerText = channelName;

    // Смяна на активните Tailwind селектори (почистване и добавяне на червения акцент)
    document.querySelectorAll('[id^="ch-"]').forEach(el => {
        el.classList.remove('border-red-500', 'bg-red-50/30', 'dark:bg-red-500/5', 'dark:border-red-500/30');
    });
    const activeBtn = document.getElementById(`ch-${id}`);
    if (activeBtn) {
        activeBtn.classList.add('border-red-500', 'bg-red-50/30', 'dark:bg-red-500/5', 'dark:border-red-500/30');
    }

    loadStream(id);
    loadProgram(id);
}

// Извличане на конкретния стрийм адрес и подаване към плейъра

   let daysOffset = 0; // 0 = Днес, 1 = Утре, 2 = Вдругиден

    }

// Помощна функция, която връща дата във формат "ДД.ММ" спрямо отместването (offset)
function getFormattedDateString(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    return `${day}.${month}`;
}

// ГЛАВНА ФУНКЦИЯ: Зареждане и интелигентно филтриране по Ден и Канал
async function loadProgram(channelId) {
    const container = document.getElementById('programContainer');
    container.innerHTML = `<div class="text-xs font-semibold text-slate-400 p-2 animate-pulse">Филтриране на програмата...</div>`;
    
    try {
        const res = await fetch('program.txt');
        if (!res.ok) throw new Error();
        const rawText = await res.text();
        
        // Разделяме текста на отделни редове
        const lines = rawText.split('\n');
        
        // Взимаме търсената дата спрямо избрания бутон (напр. "06.06")
        const targetDate = getFormattedDateString(daysOffset);
        
        const channelKeywords = {
            diema1: ['diema sport', 'диема спорт', 'ds1'],
            diema2: ['diema sport 2', 'диема спорт 2', 'ds2'],
            diema3: ['diema sport 3', 'диема спорт 3', 'ds3'],
            max1: ['max sport 1', 'макс спорт 1', 'ms1'],
            max2: ['max sport 2', 'макс спорт 2', 'ms2'],
            euro1: ['eurosport 1', 'евроспорт 1', 'e1'],
            euro2: ['eurosport 2', 'евроспорт 2', 'e2'],
            btv_comedy: ['btv comedy', 'бтв комеди'],
            star_channel: ['star channel', 'стар ченъл'],
            star_life: ['star life', 'стар лайф']
        };

        const currentKeywords = channelKeywords[channelId] || [];
        let isInsideTargetSection = false;
        let channelEvents = [];
        
        // Модифициран регулярнен израз, който засича часове (напр. 06.00 или 14:30)
        const timeRegex = /^(\d{1,2}[\.:]\d{2})$/;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            const lowerLine = line.toLowerCase();
            
            // Проверяваме дали редът е заглавие на канал
            const isAnyChannelHeader = Object.values(channelKeywords).some(keywords => 
                keywords.some(kw => lowerLine.includes(kw))
            );

            if (isAnyChannelHeader) {
                const matchKeywords = currentKeywords.some(kw => lowerLine.includes(kw));
                const matchDate = lowerLine.includes(`[${targetDate}]`) || lowerLine.includes(`${targetDate}`);
                isInsideTargetSection = matchKeywords && matchDate;
                continue;
            }

            if (isInsideTargetSection) {
                const match = line.match(timeRegex);
                // Ако редът е само час, вземи следващия за заглавие на предаването
                if (match) {
                    const time = match[1].replace('.', ':'); // превръща 06.00 в 06:00
                    let title = "";
                    
                    // Търсим следващия ред, който не е празен, за да вземем името на предаването
                    let j = i + 1;
                    while (j < lines.length && !title) {
                        let nextLine = lines[j].trim();
                        if (nextLine && !nextLine.match(timeRegex) && !Object.values(channelKeywords).some(k => k.some(kw => nextLine.toLowerCase().includes(kw)))) {
                            title = nextLine;
                        } else if (nextLine) {
                            break;
                        }
                        j++;
                    }
                    
                    if (title) {
                        // Почистване на излишни символи от скрапване като _x000D_ или /n/
                        title = title.replace(/_x000D_/g, '').replace(/\/n\//g, '').replace(/,/g, '').trim();
                        
                        let emoji = '📺';
                        const lowerTitle = title.toLowerCase();
                        if (lowerTitle.includes('футбол') || lowerTitle.includes('лига') || lowerTitle.includes('мач')) emoji = '⚽';
                        else if (lowerTitle.includes('формула') || lowerTitle.includes('f1') || lowerTitle.includes('наскар')) emoji = '🏎️';
                        else if (lowerTitle.includes('мото') || lowerTitle.includes('motogp')) emoji = '🏍️';
                        else if (lowerTitle.includes('тенис') || lowerTitle.includes('atp')) emoji = '🎾';
                        else if (lowerTitle.includes('баскетбол') || lowerTitle.includes('нба')) emoji = '🏀';

                        channelEvents.push({ time, title: `${emoji} ${title}` });
                    }
                }
            }
        }

        // Рендиране на картичките
        if (channelEvents.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center pt-8 text-center px-4">
                    <p class="text-xs font-semibold text-slate-400 dark:text-zinc-500">Няма въведени събития за дата ${targetDate} на този канал.</p>
                </div>`;
            return;
        }

        container.innerHTML = channelEvents.map(event => `
            <div class="p-3.5 bg-slate-50/80 dark:bg-zinc-900/60 rounded-xl border border-slate-200/40 dark:border-zinc-800/50 shadow-2xs hover:border-red-500/20 dark:hover:border-red-500/20 transition-all duration-200">
                <div class="text-xs font-black text-red-500 dark:text-red-400 mb-1 tracking-wider">${event.time}</div>
                <h5 class="text-xs font-bold text-slate-950 dark:text-white leading-snug">${event.title}</h5>
            </div>
        `).join('');

    } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="text-xs font-semibold text-red-500 p-2">Проблем при четене на program.txt.</div>`;
    }
}
}

function updateButtonState(button, channelId) {
    const isSelected = (channelId === currentSelectedChannel);
    const baseClasses = "w-16 h-12 p-2 rounded-xl border flex items-center justify-center transition-all duration-150 active:scale-95 shadow-xs ";
    
    if (isSelected) {
        button.className = baseClasses + "bg-red-500/10 border-red-500 ring-2 ring-red-500/20 dark:bg-red-500/20 dark:border-red-400";
    } else {
        button.className = baseClasses + "bg-slate-50 border-slate-200 dark:bg-zinc-950 dark:border-zinc-850 hover:bg-slate-100 dark:hover:bg-zinc-900";
    }
}

// Извикваме функцията, за да се заредят бутоните веднага при стартиране на страницата
renderFilters();
    </script>
